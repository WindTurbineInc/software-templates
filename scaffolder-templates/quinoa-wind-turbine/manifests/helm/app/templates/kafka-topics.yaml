# Topics used by the game. The Kafka Streams topology waits for power and game-events to exist,
# and race-progress is compacted because each replica only needs the latest race snapshot.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: power
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: game-events
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: race-progress
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
  config:
    cleanup.policy: compact
